<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>WebGL Demo — 1000 Moving Objects</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #05070d;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #hud {
    position: fixed;
    top: 10px;
    left: 12px;
    color: #9fd4ff;
    font: 13px/1.4 monospace;
    background: rgba(0, 0, 0, 0.35);
    padding: 8px 12px;
    border-radius: 6px;
    pointer-events: none;
    user-select: none;
  }
  #controls {
    position: fixed;
    bottom: 14px;
    left: 12px;
    color: #9fd4ff;
    font: 13px/1.4 monospace;
    background: rgba(0, 0, 0, 0.45);
    padding: 10px 14px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 10px;
    user-select: none;
  }
  #controls input[type="range"] {
    width: 280px;
  }
</style>
</head>
<body>
<canvas id="glcanvas"></canvas>
<div id="hud">objects: 1000 | fps: --</div>
<div id="controls">
  <label for="countSlider">objects</label>
  <input type="range" id="countSlider" min="1" max="20000" step="1" value="1000" />
  <span id="countLabel">1000</span>
</div>
<script>
(function () {
  const MAX_COUNT = 20000;
  let activeCount = 1000;
  const canvas = document.getElementById('glcanvas');
  const hud = document.getElementById('hud');

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) {
    hud.textContent = 'WebGL is not available in this browser.';
    return;
  }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener('resize', resize);
  resize();

  function compile(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(shader));
    }
    return shader;
  }

  const vsSource = `
    attribute vec2 a_position;
    attribute vec3 a_color;
    attribute float a_size;
    varying vec3 v_color;
    void main(void) {
      gl_Position = vec4(a_position, 0.0, 1.0);
      gl_PointSize = a_size;
      v_color = a_color;
    }
  `;

  const fsSource = `
    precision mediump float;
    varying vec3 v_color;
    void main(void) {
      // round the point sprite and soften the edge
      vec2 c = gl_PointCoord - vec2(0.5);
      float d = length(c);
      if (d > 0.5) discard;
      float alpha = smoothstep(0.5, 0.35, d);
      gl_FragColor = vec4(v_color, alpha);
    }
  `;

  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, vsSource));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fsSource));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(program));
  }
  gl.useProgram(program);

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

  // Per-object simulation state (positions in clip space [-1, 1], velocities per second).
  // Arrays are pre-allocated at MAX_COUNT so the slider can grow/shrink the active
  // object count instantly without reallocating or losing in-flight motion.
  const positions = new Float32Array(MAX_COUNT * 2);
  const velocities = new Float32Array(MAX_COUNT * 2);
  const colors = new Float32Array(MAX_COUNT * 3);
  const sizes = new Float32Array(MAX_COUNT);

  function rand(min, max) { return min + Math.random() * (max - min); }

  function initObject(i) {
    positions[i * 2 + 0] = rand(-1, 1);
    positions[i * 2 + 1] = rand(-1, 1);

    const speed = rand(0.05, 0.4);
    const angle = rand(0, Math.PI * 2);
    velocities[i * 2 + 0] = Math.cos(angle) * speed;
    velocities[i * 2 + 1] = Math.sin(angle) * speed;

    const hue = Math.random();
    const [r, g, b] = hsvToRgb(hue, 0.65, 1.0);
    colors[i * 3 + 0] = r;
    colors[i * 3 + 1] = g;
    colors[i * 3 + 2] = b;

    sizes[i] = rand(3, 9) * (window.devicePixelRatio || 1);
  }

  for (let i = 0; i < MAX_COUNT; i++) initObject(i);

  function hsvToRgb(h, s, v) {
    const i = Math.floor(h * 6);
    const f = h * 6 - i;
    const p = v * (1 - s);
    const q = v * (1 - f * s);
    const t = v * (1 - (1 - f) * s);
    switch (i % 6) {
      case 0: return [v, t, p];
      case 1: return [q, v, p];
      case 2: return [p, v, t];
      case 3: return [p, q, v];
      case 4: return [t, p, v];
      default: return [v, p, q];
    }
  }

  const positionBuffer = gl.createBuffer();
  const colorBuffer = gl.createBuffer();
  const sizeBuffer = gl.createBuffer();

  gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, colors, gl.STATIC_DRAW);
  const colorLoc = gl.getAttribLocation(program, 'a_color');
  gl.enableVertexAttribArray(colorLoc);
  gl.vertexAttribPointer(colorLoc, 3, gl.FLOAT, false, 0, 0);

  gl.bindBuffer(gl.ARRAY_BUFFER, sizeBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, sizes, gl.STATIC_DRAW);
  const sizeLoc = gl.getAttribLocation(program, 'a_size');
  gl.enableVertexAttribArray(sizeLoc);
  gl.vertexAttribPointer(sizeLoc, 1, gl.FLOAT, false, 0, 0);

  const positionLoc = gl.getAttribLocation(program, 'a_position');
  gl.enableVertexAttribArray(positionLoc);

  let lastTime = performance.now();
  let fpsAccum = 0;
  let fpsFrames = 0;
  let fpsTimer = 0;

  function step(dt) {
    for (let i = 0; i < activeCount; i++) {
      let x = positions[i * 2 + 0] + velocities[i * 2 + 0] * dt;
      let y = positions[i * 2 + 1] + velocities[i * 2 + 1] * dt;

      if (x > 1 || x < -1) {
        velocities[i * 2 + 0] *= -1;
        x = Math.max(-1, Math.min(1, x));
      }
      if (y > 1 || y < -1) {
        velocities[i * 2 + 1] *= -1;
        y = Math.max(-1, Math.min(1, y));
      }

      positions[i * 2 + 0] = x;
      positions[i * 2 + 1] = y;
    }
  }

  function render() {
    const now = performance.now();
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;

    step(dt);

    gl.clearColor(0.02, 0.03, 0.06, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);

    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    // Only upload the positions actually being drawn this frame, not the whole
    // MAX_COUNT-sized backing array, so the slider stays cheap at low counts.
    gl.bufferData(gl.ARRAY_BUFFER, positions.subarray(0, activeCount * 2), gl.DYNAMIC_DRAW);
    gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);

    gl.drawArrays(gl.POINTS, 0, activeCount);

    fpsAccum += dt;
    fpsFrames++;
    fpsTimer += dt;
    if (fpsTimer >= 0.5) {
      const fps = Math.round(fpsFrames / fpsAccum);
      hud.textContent = `objects: ${activeCount} | fps: ${fps}`;
      fpsAccum = 0;
      fpsFrames = 0;
      fpsTimer = 0;
    }

    requestAnimationFrame(render);
  }

  const countSlider = document.getElementById('countSlider');
  const countLabel = document.getElementById('countLabel');
  countSlider.max = String(MAX_COUNT);
  countSlider.value = String(activeCount);
  countLabel.textContent = String(activeCount);

  countSlider.addEventListener('input', () => {
    activeCount = parseInt(countSlider.value, 10);
    countLabel.textContent = String(activeCount);
  });

  requestAnimationFrame(render);
})();
</script>
</body>
</html>
